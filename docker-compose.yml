services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vms-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      CEIPAL_CACHE_DIR: /app/data/cache
      DATABASE_URL: sqlite:////app/data/vms.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vms-frontend
    depends_on:
      - backend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
      STREAMLIT_SERVER_PORT: 8501
    restart: unless-stopped
