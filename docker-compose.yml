services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vms-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      CEIPAL_CACHE_DIR: /app/data/cache
    volumes:
      - ./data:/app/data
    restart: unless-stopped
